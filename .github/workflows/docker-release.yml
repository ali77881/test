
name: Python CI CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Tests
        run: pytest -v

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ali77881/test:latest
            ghcr.io/ali77881/test:${{ github.sha }}

  deploy:
    name: Deploy to kuber7
    needs: build-and-push
    runs-on: [self-hosted, linux, x64, kuber7]

    permissions:
      contents: read
      packages: read

    steps:
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Pull New Image
        run: |
          docker pull ghcr.io/ali77881/test:${{ github.sha }}

      - name: Stop Old Container
        run: |
          docker rm -f test-app || true

      - name: Start New Container
        run: |
          docker run -d \
            --name test-app \
            --restart unless-stopped \
            -p 5000:5000 \
            ghcr.io/ali77881/test:${{ github.sha }}

      - name: Verify Application
        run: |
          sleep 5
          curl --fail http://127.0.0.1:5000/

      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io
