
name: Python CI & Build

permissions:
  contents: write

on:
  push:
    paths:
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/python*"
  release:
    types: [published]

jobs:
  setup-python:
    name: Setup Python workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Upload workspace as artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-workspace
          path: ./
          retention-days: 1

  test-python:
    name: Run tests
    needs: setup-python
    runs-on: ubuntu-latest

    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: python-workspace

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v test_main.py

  build:
    name: Build release binaries
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: test-python
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile \
            --name python_web_hello_world_${{ runner.os }} \
            main.py

      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
